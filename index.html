<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <!-- NAVIGATION -->
  <header class="nav">
    <a class="nav__brand" href="#home">♥ <span id="navName"></span></a>
    <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav__links" id="navLinks">
      <a href="#home">Home</a>
      <a href="#message">Message</a>
      <a href="#gallery">Gallery</a>
      <a href="#countdown">Countdown</a>
      <a href="#surprise">Surprise</a>
      <a href="#final">Final</a>
    </nav>
  </header>

  <main>
    <!-- HOME -->
    <section class="section hero" id="home">
      <div class="hero__photo-wrap">
        <img class="hero__photo" id="mainPhoto" alt="">
        <span class="hero__cake" aria-hidden="true">🎂</span>
      </div>
      <h1 class="script hero__title" id="heroGreeting"></h1>
      <p class="hero__intro" id="heroIntro"></p>
      <a class="btn" href="#surprise" id="openSurpriseBtn">Open Your Surprise</a>
    </section>

    <!-- MESSAGE -->
    <section class="section" id="message">
      <h2 class="script">A Letter For You</h2>
      <article class="letter-card">
        <p class="letter-card__to script" id="letterTo"></p>
        <div class="letter-card__body" id="letterBody" aria-live="polite"></div>
      </article>
      <a class="btn btn--ghost" href="#home">Back to Home</a>
    </section>

    <!-- GALLERY -->
    <section class="section" id="gallery">
      <h2 class="script">Our Memories</h2>
      <div class="gallery" id="galleryGrid"></div>
    </section>

    <!-- COUNTDOWN -->
    <section class="section" id="countdown">
      <h2 class="script" id="countdownTitle">Counting Down To Your Day</h2>
      <div class="timer" id="timer">
        <div class="timer__box"><strong id="cdDays">0</strong><span>Days</span></div>
        <div class="timer__box"><strong id="cdHours">0</strong><span>Hours</span></div>
        <div class="timer__box"><strong id="cdMinutes">0</strong><span>Minutes</span></div>
        <div class="timer__box"><strong id="cdSeconds">0</strong><span>Seconds</span></div>
      </div>
      <p class="countdown__done" id="countdownDone" hidden></p>
    </section>

    <!-- SURPRISE -->
    <section class="section" id="surprise">
      <h2 class="script">A Little Surprise</h2>
      <p class="hint" id="surpriseHint">Tap the envelope</p>
      <button class="envelope" id="envelope" aria-expanded="false" aria-label="Open the envelope">
        <span class="envelope__back"></span>
        <span class="envelope__flap"></span>
        <span class="envelope__front"></span>
        <span class="envelope__heart">♥</span>
      </button>
      <div class="reveal" id="reveal" hidden>
        <p class="script reveal__title">Happy Birthday!</p>
        <p class="reveal__text" id="surpriseText"></p>
        <button class="btn" id="closeSurprise">Close</button>
      </div>
    </section>

    <!-- FINAL -->
    <section class="section final" id="final">
      <div class="final__hearts" aria-hidden="true">♥ ♥ ♥</div>
      <h2 class="script">Forever Yours</h2>
      <p class="final__text" id="finalText"></p>
      <a class="btn" href="#home">Back to Home</a>
    </section>
  </main>

  <!-- MUSIC PLAYER -->
  <div class="music">
    <button class="music__btn" id="musicBtn" aria-pressed="false">
      <span id="musicIcon">▶</span> <span id="musicLabel">Play music</span>
    </button>
    <span class="music__status" id="musicStatus">Music off</span>
    <audio id="bgMusic" loop preload="none"></audio>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__close" id="lbClose" aria-label="Close photo">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <figure class="lightbox__figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next photo">›</button>
  </div>

  <!-- data.js must load BEFORE script.js -->
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
